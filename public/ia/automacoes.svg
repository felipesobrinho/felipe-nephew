<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Automações: antes e depois</title>
  <desc id="d">Antes, uma tarefa manual repetida quase todos os dias levava de 30 minutos a 1 hora. Depois, um gatilho dispara um fluxo no Power Automate que usa o Microsoft Graph e entrega o resultado sem etapa manual. Total: cerca de 30 horas por mês economizadas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#93c5fd"/>
    </marker>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="40" y="58" fill="#f8fafc" font-size="26" font-weight="700">Automações de processos</text>
    <text x="40" y="86" fill="#94a3b8" font-size="15">Power Automate · Microsoft Graph · notificações do agendamento</text>

    <text x="40" y="140" fill="#fca5a5" font-size="13" font-weight="700" letter-spacing="2">ANTES</text>
    <g font-size="14" fill="#e2e8f0">
      <rect x="40" y="154" width="200" height="64" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="140" y="183" text-anchor="middle">Demanda chega</text>
      <text x="140" y="203" text-anchor="middle" fill="#94a3b8" font-size="12">todo dia</text>
      <rect x="290" y="154" width="220" height="64" rx="10" fill="#1e293b" stroke="#f87171"/>
      <text x="400" y="183" text-anchor="middle">Etapas manuais</text>
      <text x="400" y="203" text-anchor="middle" fill="#fca5a5" font-size="12">30 min a 1 h cada</text>
      <rect x="560" y="154" width="200" height="64" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="660" y="183" text-anchor="middle">Aviso / registro</text>
      <text x="660" y="203" text-anchor="middle" fill="#94a3b8" font-size="12">feito à mão</text>
    </g>
    <path d="M240 186H284" stroke="#93c5fd" stroke-width="2" marker-end="url(#a)"/>
    <path d="M510 186H554" stroke="#93c5fd" stroke-width="2" marker-end="url(#a)"/>

    <text x="40" y="270" fill="#86efac" font-size="13" font-weight="700" letter-spacing="2">DEPOIS</text>
    <g font-size="14" fill="#e2e8f0">
      <rect x="40" y="284" width="160" height="64" rx="10" fill="#0f172a" stroke="#3b82f6"/>
      <text x="120" y="313" text-anchor="middle">Gatilho</text>
      <text x="120" y="333" text-anchor="middle" fill="#93c5fd" font-size="12">evento ou horário</text>
      <rect x="240" y="284" width="160" height="64" rx="10" fill="#0f172a" stroke="#3b82f6"/>
      <text x="320" y="313" text-anchor="middle">Power Automate</text>
      <text x="320" y="333" text-anchor="middle" fill="#93c5fd" font-size="12">fluxo</text>
      <rect x="440" y="284" width="160" height="64" rx="10" fill="#0f172a" stroke="#3b82f6"/>
      <text x="520" y="313" text-anchor="middle">Microsoft Graph</text>
      <text x="520" y="333" text-anchor="middle" fill="#93c5fd" font-size="12">APIs do Microsoft 365</text>
      <rect x="640" y="284" width="120" height="64" rx="10" fill="#0f172a" stroke="#22c55e"/>
      <text x="700" y="320" text-anchor="middle">Pronto</text>
    </g>
    <path d="M200 316H234" stroke="#93c5fd" stroke-width="2" marker-end="url(#a)"/>
    <path d="M400 316H434" stroke="#93c5fd" stroke-width="2" marker-end="url(#a)"/>
    <path d="M600 316H634" stroke="#93c5fd" stroke-width="2" marker-end="url(#a)"/>

    <rect x="40" y="396" width="720" height="68" rx="12" fill="#0b1220" stroke="#3b82f6" stroke-opacity="0.6"/>
    <text x="64" y="438" fill="#f8fafc" font-size="28" font-weight="700">~30 h/mês</text>
    <text x="232" y="436" fill="#cbd5e1" font-size="16">economizadas — quase todas as automações rodam diariamente</text>
  </g>
</svg>
